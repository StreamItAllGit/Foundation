name: CI Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      FOUNDATION_SUPPRESS_MODALS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run .NET unit tests (zero warnings)
        run: dotnet test Dev/Foundation.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Run Python foundation_core unit tests
        run: python -m unittest discover -s Dev/tests/foundation_core -v
