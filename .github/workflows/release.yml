name: Release & SignPath Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FOUNDATION_SUPPRESS_MODALS: "1"
    outputs:
      artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test, build, and stage unsigned SDK ZIP
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $state = Get-Content -LiteralPath "active.state" -Raw | ConvertFrom-Json
          $ver = [string]$state.version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          dotnet test Dev/Foundation.sln -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Dev/tests/foundation_core -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Dev/Foundation.sln -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:FOUNDATION_SHARED_LIBS_ROOT = Join-Path $env:RUNNER_TEMP "SharedLibs/Foundation"
          python Dev/tools/sync_foundation_sdk.py --version $ver --ui-version $ver --configuration Release --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "Releases/Latest" | Out-Null
          Copy-Item -LiteralPath "README.md", "FEATURES.md", "CHANGELOG.md" -Destination "Releases/Latest" -Force
          $releaseNotes = "# Foundation v$ver`n`nAutomated release build of the Foundation Shared SDK (v$ver). See CHANGELOG.md and README.md for full details.`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "Releases/Latest") "RELEASE_NOTES.md"), $releaseNotes, [System.Text.UTF8Encoding]::new($false))
          python Dev/tools/build_release_universal.py Releases/Latest --stage-sdk-zip (Join-Path $env:FOUNDATION_SHARED_LIBS_ROOT "v$ver") --version $ver --allow-sdk-zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned SDK ZIP for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-sdk-zip
          path: Releases/Latest/Foundation-v*.zip
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-latest
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Upload signed SDK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: signed-sdk-zip
          path: dist/*

      - name: Publish signed SDK ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ($tag -match '^v0\.|-(alpha|beta|rc|nightly|hf)') { @("--prerelease") } else { @() }
            gh release create $tag @pre --title "Foundation $tag" --notes "Signed Foundation SDK $tag"
          }
          $files = Get-ChildItem "dist" -File | ForEach-Object { $_.FullName }
          gh release upload $tag @files --clobber
